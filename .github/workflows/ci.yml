name: Verify CyberUI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:consumer
        env:
          CYBERUI_CONSUMER_OFFLINE: '0'
      - run: pnpm test:registry
        env:
          CYBERUI_GITHUB_REF: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-package-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
